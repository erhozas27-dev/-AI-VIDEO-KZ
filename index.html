<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI VIDEO KZ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:20px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #283047}
.logo{font-size:25px;font-weight:bold;color:#8b7cff}
select,button,textarea{border-radius:10px;padding:12px;border:1px solid #39415c;background:#171f35;color:white}
main{max-width:950px;margin:45px auto;padding:20px}
h1{text-align:center;font-size:38px}
.sub{text-align:center;color:#aeb8d0}
.tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:30px 0}
.tabs button{cursor:pointer}
.tabs button.active{background:#705cff}
.panel{background:#151d32;border:1px solid #303a58;border-radius:18px;padding:25px}
textarea{width:100%;height:120px;resize:vertical;margin:15px 0;font-size:16px}
.action{background:#705cff;border:0;width:100%;font-size:16px;cursor:pointer}
.upload{display:block;padding:20px;border:1px dashed #66708d;border-radius:12px;margin:15px 0}
#preview{width:100%;max-height:400px;object-fit:contain;margin-top:20px}
.note{color:#aeb8d0;font-size:13px;line-height:1.6}
footer{text-align:center;color:#8791aa;padding:35px}
</style>
</head>
<body>
<header>
<div class="logo">✨ AI VIDEO KZ</div>
<select id="language" onchange="changeLang()">
<option value="kk">Қазақша</option>
<option value="ru">Русский</option>
</select>
</header>
<main>
<h1 id="title">Жасанды интеллект әлемі</h1>
<p class="sub" id="subtitle">Сурет пен видео жасауға арналған AI платформа</p>
<div class="tabs">
<button class="active" onclick="setMode('image',this)" id="tab1">🎨 Сурет жасау</button>
<button onclick="setMode('video',this)" id="tab2">🎬 Видео жасау</button>
<button onclick="setMode('animate',this)" id="tab3">🖼️ Суретті жандандыру</button>
</div>
<section class="panel">
<h2 id="modeTitle">AI арқылы сурет жасау</h2>
<label id="promptLabel">Не жасағыңыз келеді?</label>
<textarea id="prompt" placeholder="Мысалы: Әдемі табиғат, таулар, күннің батуы..."></textarea>
<label class="upload">
<span id="uploadText">📁 Суретті таңдаңыз (қажет болса)</span>
<input type="file" id="file" accept="image/*" hidden onchange="showImage(event)">
</label>
<button class="action" onclick="generate()" id="generateBtn">✨ Жасау</button>
<img id="preview" hidden>
<p class="note" id="notice">Бұл — бастапқы интерфейс. Нақты AI генерациясын қосу үшін қауіпсіз сервер және AI API қажет.</p>
<div id="result"></div>
</section>
</main>
<footer>© 2026 AI VIDEO KZ</footer>
<script>
let mode="image";
const translations={
kk:{
title:"Жасанды интеллект әлемі",subtitle:"Сурет пен видео жасауға арналған AI платформа",
tabs:["🎨 Сурет жасау","🎬 Видео жасау","🖼️ Суретті жандандыру"],
modes:["AI арқылы сурет жасау","Мәтіннен видео жасау","Суретті видеоға айналдыру"],
prompt:"Не жасағыңыз келеді?",upload:"📁 Суретті таңдаңыз (қажет болса)",
generate:"✨ Жасау",notice:"Бұл — бастапқы интерфейс. Нақты AI генерациясын қосу үшін қауіпсіз сервер және AI API қажет.",
empty:"Алдымен мәтін жазыңыз.",pending:"AI генерациясын қосу үшін сервер/API баптау қажет."
},
ru:{
title:"Мир искусственного интеллекта",subtitle:"AI-платформа для создания изображений и видео",
tabs:["🎨 Создать изображение","🎬 Создать видео","🖼️ Оживить изображение"],
modes:["Создание изображения с AI","Создание видео из текста","Превращение изображения в видео"],
prompt:"Что хотите создать?",upload:"📁 Выберите изображение (если нужно)",
generate:"✨ Создать",notice:"Это начальный интерфейс. Для настоящей AI-генерации нужен защищённый сервер и AI API.",
empty:"Сначала введите описание.",pending:"Для AI-генерации необходимо подключить сервер/API."
}};
function changeLang(){
let t=translations[language.value];
document.documentElement.lang=language.value;
title.textContent=t.title;subtitle.textContent=t.subtitle;
tab1.textContent=t.tabs[0];tab2.textContent=t.tabs[1];tab3.textContent=t.tabs[2];
promptLabel.textContent=t.prompt;uploadText.textContent=t.upload;
generateBtn.textContent=t.generate;notice.textContent=t.notice;
updateMode();
}
function setMode(m,b){
mode=m;document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
b.classList.add("active");updateMode();
}
function updateMode(){
let t=translations[language.value];
modeTitle.textContent=t.modes[mode==="image"?0:mode==="video"?1:2];
}
function showImage(e){
let f=e.target.files[0];if(!f)return;
preview.src=URL.createObjectURL(f);preview.hidden=false;
}
function generate(){
let t=translations[language.value];
if(!prompt.value.trim()){result.textContent=t.empty;return;}
result.textContent=t.pending;
}
</script>
</body>
</html>
